<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="alertGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="successGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <circle cx="1000" cy="120" r="280" fill="#06B6D4" opacity="0.08" filter="url(#glow)" />
  <circle cx="150" cy="500" r="240" fill="#3B82F6" opacity="0.07" filter="url(#glow)" />

  <!-- Top Header / Badge -->
  <rect x="60" y="45" width="220" height="34" rx="17" fill="#06B6D4" fill-opacity="0.12" stroke="#06B6D4" stroke-opacity="0.3" />
  <circle cx="80" cy="62" r="5" fill="#06B6D4" />
  <text x="96" y="67" fill="#67E8F9" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="1">ARCHITECTURAL DIAGRAM</text>

  <text x="60" y="125" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800">iOS Safari WebKit Touch &amp; Mobile Navigation Engineering</text>
  <text x="60" y="160" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="16">Root Cause Analysis vs. Production Engineering Solution</text>

  <!-- Left Column: The Problem State (Red / Amber) -->
  <g transform="translate(60, 195)">
    <rect width="510" height="380" rx="20" fill="#0F172A" stroke="#EF4444" stroke-opacity="0.3" stroke-width="1.5" />
    <rect x="25" y="24" width="130" height="26" rx="13" fill="#EF4444" fill-opacity="0.15" />
    <text x="40" y="41" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="12" font-weight="700">ROOT CAUSES</text>
    
    <text x="25" y="80" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">WebKit Event Collisions &amp; CSS Glitches</text>

    <!-- Item 1 -->
    <circle cx="35" cy="120" r="4" fill="#EF4444" />
    <text x="50" y="125" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Theme Global Anchor Listener</text>
    <text x="50" y="145" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Parent accordion taps trigger .mobile_menu_bar click = auto-collapse</text>

    <!-- Item 2 -->
    <circle cx="35" cy="180" r="4" fill="#EF4444" />
    <text x="50" y="185" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Premature iOS Navigation</text>
    <text x="50" y="205" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Missing e.preventDefault() on touch causes immediate Safari page exit</text>

    <!-- Item 3 -->
    <circle cx="35" cy="240" r="4" fill="#EF4444" />
    <text x="50" y="245" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">CSS Specificity Collision (Double Arrow)</text>
    <text x="50" y="265" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">svg.arrow (0,3,1) overrides .arrow-up (0,3,0) = competing dual icons</text>

    <!-- Item 4 -->
    <circle cx="35" cy="300" r="4" fill="#EF4444" />
    <text x="50" y="305" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">300ms Synthetic Click Delay &amp; Ghosting</text>
    <text x="50" y="325" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">touchend fires followed by delayed synthetic click = accordion double-toggle</text>
  </g>

  <!-- Right Column: The Solution (Cyan / Emerald) -->
  <g transform="translate(630, 195)">
    <rect width="510" height="380" rx="20" fill="#0F172A" stroke="#10B981" stroke-opacity="0.3" stroke-width="1.5" />
    <rect x="25" y="24" width="160" height="26" rx="13" fill="#10B981" fill-opacity="0.15" />
    <text x="40" y="41" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">ENGINEERED SOLUTION</text>
    
    <text x="25" y="80" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Hardware-Accelerated 4-Pillar Architecture</text>

    <!-- Solution 1 -->
    <circle cx="35" cy="120" r="4" fill="#10B981" />
    <text x="50" y="125" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Listener Disarmament via $(link).off('click')</text>
    <text x="50" y="145" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Surgically unhooks parent collapse while keeping destination links active</text>

    <!-- Solution 2 -->
    <circle cx="35" cy="180" r="4" fill="#10B981" />
    <text x="50" y="185" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">600ms High-Performance Debounce Window</text>
    <text x="50" y="205" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Tracks Date.now() timestamp to swallow delayed ghost synthetic clicks</text>

    <!-- Solution 3 -->
    <circle cx="35" cy="240" r="4" fill="#10B981" />
    <text x="50" y="245" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Single SVG with 60fps CSS transform: rotate(180deg)</text>
    <text x="50" y="265" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Eliminates DOM swapping and specificity races with smooth hardware acceleration</text>

    <!-- Solution 4 -->
    <circle cx="35" cy="300" r="4" fill="#10B981" />
    <text x="50" y="305" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Contextual Dual-Action Parent Routing</text>
    <text x="50" y="325" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">1st tap expands sub-items; 2nd tap navigates; dedicated 60px toggle zone</text>
  </g>
</svg>
